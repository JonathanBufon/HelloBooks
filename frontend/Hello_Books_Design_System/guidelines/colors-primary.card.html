<!-- @dsCard group="Colors" viewport="700x150" name="Roxo institucional" subtitle="Cor de marca — hierarquia, ação e estado ativo" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--color-bg); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .sw { width: 104px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--color-border); background: var(--color-surface); }
  .chip { height: 60px; }
  .meta { padding: 8px 10px; font-family: var(--font-sans); }
  .name { font-size: 12px; font-weight: 700; color: var(--color-text); }
  .hex { font-size: 11px; color: var(--color-text-soft); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#5B00C9"></div><div class="meta"><div class="name">primary</div><div class="hex">#5B00C9</div></div></div>
    <div class="sw"><div class="chip" style="background:#6D1ED6"></div><div class="meta"><div class="name">primary-600</div><div class="hex">#6D1ED6</div></div></div>
    <div class="sw"><div class="chip" style="background:#7C3AED"></div><div class="meta"><div class="name">primary-500</div><div class="hex">#7C3AED</div></div></div>
    <div class="sw"><div class="chip" style="background:#C4B5FD"></div><div class="meta"><div class="name">primary-300</div><div class="hex">#C4B5FD</div></div></div>
    <div class="sw"><div class="chip" style="background:#EDE9FE"></div><div class="meta"><div class="name">primary-100</div><div class="hex">#EDE9FE</div></div></div>
    <div class="sw"><div class="chip" style="background:#F5F3FF"></div><div class="meta"><div class="name">primary-50</div><div class="hex">#F5F3FF</div></div></div>
  </div>
</body>
</html>
