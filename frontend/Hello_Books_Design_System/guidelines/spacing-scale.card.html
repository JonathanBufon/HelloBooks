<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--color-surface); font-family: var(--font-sans); }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .item { text-align: center; }
  .bar { background: var(--color-primary-300); border-radius: 4px; width: 100%; }
  .v { font-size: 11px; color: var(--color-text-soft); margin-top: 6px; }
  .t { font-size: 11px; color: var(--color-text); font-weight: 700; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px;width:4px"></div><div class="t">1</div><div class="v">4</div></div>
    <div class="item"><div class="bar" style="height:8px;width:8px"></div><div class="t">2</div><div class="v">8</div></div>
    <div class="item"><div class="bar" style="height:12px;width:12px"></div><div class="t">3</div><div class="v">12</div></div>
    <div class="item"><div class="bar" style="height:16px;width:16px"></div><div class="t">4</div><div class="v">16</div></div>
    <div class="item"><div class="bar" style="height:20px;width:20px"></div><div class="t">5</div><div class="v">20</div></div>
    <div class="item"><div class="bar" style="height:24px;width:24px"></div><div class="t">6</div><div class="v">24</div></div>
    <div class="item"><div class="bar" style="height:32px;width:32px"></div><div class="t">8</div><div class="v">32</div></div>
    <div class="item"><div class="bar" style="height:40px;width:40px"></div><div class="t">10</div><div class="v">40</div></div>
    <div class="item"><div class="bar" style="height:48px;width:48px"></div><div class="t">12</div><div class="v">48</div></div>
  </div>
</body>
</html>
