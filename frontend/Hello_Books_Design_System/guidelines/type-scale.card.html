<!-- @dsCard group="Type" viewport="700x300" name="Escala tipográfica" subtitle="Inter — de métrica grande a metadados" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-surface); }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .tag { font-family: var(--font-sans); font-size: 11px; color: var(--color-text-soft); width: 120px; flex-shrink: 0; font-weight: 600; }
  .spec { color: var(--color-text); font-family: var(--font-sans); }
</style>
</head>
<body>
  <div class="stack">
    <div class="row"><span class="tag">3xl · 36 / 800</span><span class="spec" style="font-size:36px;font-weight:800;letter-spacing:-.01em">12.480</span></div>
    <div class="row"><span class="tag">2xl · 28 / 800</span><span class="spec" style="font-size:28px;font-weight:800;letter-spacing:-.01em">Título de Página</span></div>
    <div class="row"><span class="tag">xl · 22 / 700</span><span class="spec" style="font-size:22px;font-weight:700">Título de Seção</span></div>
    <div class="row"><span class="tag">lg · 18 / 600</span><span class="spec" style="font-size:18px;font-weight:600">Título de Card</span></div>
    <div class="row"><span class="tag">base · 16 / 400</span><span class="spec" style="font-size:16px;font-weight:400">Texto padrão do corpo</span></div>
    <div class="row"><span class="tag">sm · 14 / 500</span><span class="spec" style="font-size:14px;font-weight:500">Menus, botões e campos</span></div>
    <div class="row"><span class="tag">xs · 12 / 500</span><span class="spec" style="font-size:12px;font-weight:500">Labels, badges e metadados</span></div>
  </div>
</body>
</html>
