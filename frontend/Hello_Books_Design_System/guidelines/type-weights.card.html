<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--color-surface); font-family: var(--font-sans); }
  .weights { display: flex; gap: 26px; flex-wrap: wrap; }
  .w { text-align: center; }
  .w .g { font-size: 30px; color: var(--color-text); }
  .w .l { font-size: 11px; color: var(--color-text-soft); margin-top: 4px; }
  .th { margin-top: 22px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #7A7F91; }
</style>
</head>
<body>
  <div class="weights">
    <div class="w"><div class="g" style="font-weight:400">Aa</div><div class="l">400 Regular</div></div>
    <div class="w"><div class="g" style="font-weight:500">Aa</div><div class="l">500 Medium</div></div>
    <div class="w"><div class="g" style="font-weight:600">Aa</div><div class="l">600 Semibold</div></div>
    <div class="w"><div class="g" style="font-weight:700">Aa</div><div class="l">700 Bold</div></div>
    <div class="w"><div class="g" style="font-weight:800">Aa</div><div class="l">800 Extrabold</div></div>
  </div>
  <div class="th">Cabeçalho de Tabela · Uppercase · 0.04em</div>
</body>
</html>
