<!-- @dsCard group="Colors" viewport="700x150" name="Cores semânticas" subtitle="Status: disponível, atenção, atraso, informação" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--color-bg); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .item { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 12px; }
  .top { display: flex; align-items: center; gap: 8px; }
  .dot { width: 14px; height: 14px; border-radius: 5px; }
  .name { font-size: 12px; font-weight: 700; color: var(--color-text); }
  .badge { display: inline-block; margin-top: 10px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
</style>
</head>
<body>
  <div class="grid">
    <div class="item"><div class="top"><span class="dot" style="background:#16A34A"></span><span class="name">success</span></div><span class="badge" style="background:#DCFCE7;color:#16A34A">Disponível</span></div>
    <div class="item"><div class="top"><span class="dot" style="background:#D97706"></span><span class="name">warning</span></div><span class="badge" style="background:#FEF3C7;color:#D97706">Pendente</span></div>
    <div class="item"><div class="top"><span class="dot" style="background:#DC2626"></span><span class="name">danger</span></div><span class="badge" style="background:#FEE2E2;color:#DC2626">Atrasado</span></div>
    <div class="item"><div class="top"><span class="dot" style="background:#2563EB"></span><span class="name">info</span></div><span class="badge" style="background:#DBEAFE;color:#2563EB">Manutenção</span></div>
  </div>
</body>
</html>
