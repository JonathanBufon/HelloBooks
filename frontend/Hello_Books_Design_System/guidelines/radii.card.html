<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--color-bg); font-family: var(--font-sans); }
  .row { display: flex; gap: 18px; flex-wrap: wrap; }
  .item { text-align: center; }
  .box { width: 76px; height: 60px; background: var(--color-surface); border: 1px solid var(--color-border-strong); }
  .t { font-size: 11px; color: var(--color-text); font-weight: 700; margin-top: 8px; }
  .v { font-size: 11px; color: var(--color-text-soft); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="t">sm</div><div class="v">8px</div></div>
    <div class="item"><div class="box" style="border-radius:12px"></div><div class="t">md</div><div class="v">12px</div></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><div class="t">lg</div><div class="v">16px</div></div>
    <div class="item"><div class="box" style="border-radius:20px"></div><div class="t">xl</div><div class="v">20px</div></div>
    <div class="item"><div class="box" style="border-radius:24px"></div><div class="t">2xl</div><div class="v">24px</div></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><div class="t">full</div><div class="v">999px</div></div>
  </div>
</body>
</html>
