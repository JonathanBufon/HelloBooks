<!-- @startingPoint section="HelloBooks" subtitle="Shell completo do sistema de biblioteca" viewport="1280x800" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hello Books — UI Kit</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { height: 100%; }
  body { margin: 0; }
  #app { height: 100vh; }
</style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="AppShell.jsx"></script>
  <script type="text/babel" src="LoginScreen.jsx"></script>
  <script type="text/babel" src="DashboardScreen.jsx"></script>
  <script type="text/babel" src="CatalogScreen.jsx"></script>
  <script type="text/babel" src="MemberProfileScreen.jsx"></script>
  <script type="text/babel" src="CirculationScreen.jsx"></script>

  <script type="text/babel" data-presets="react">
    function App() {
      const [loggedIn, setLoggedIn] = React.useState(true);
      const [active, setActive] = React.useState("Dashboard");

      if (!loggedIn) {
        return <LoginScreen onLogin={() => setLoggedIn(true)} />;
      }

      let screen;
      if (active === "Dashboard") screen = <DashboardScreen onNavigate={setActive} />;
      else if (active === "Catálogo") screen = <CatalogScreen />;
      else if (active === "Membros") screen = <MemberProfileScreen />;
      else if (active === "Circulação") screen = <CirculationScreen />;
      else screen = <PlaceholderScreen name={active} />;

      return (
        <AppShell active={active} onNavigate={setActive}>
          {screen}
        </AppShell>
      );
    }

    function PlaceholderScreen({ name }) {
      const { PageHeader, Card } = window.HelloBooksDesignSystem_5c47c8;
      return (
        <>
          <PageHeader title={name} subtitle="Seção em construção neste UI kit." />
          <Card>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "12px", padding: "48px", textAlign: "center" }}>
              <span style={{ width: "56px", height: "56px", borderRadius: "16px", background: "var(--color-primary-50)", color: "var(--color-primary)", display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
                <Icon name="hammer" size={26} />
              </span>
              <div style={{ fontSize: "16px", fontWeight: 700, color: "var(--color-text)" }}>{name}</div>
              <div style={{ fontSize: "14px", color: "var(--color-text-muted)", maxWidth: "360px" }}>
                Esta tela demonstra a navegação do shell. As telas completas deste kit são Dashboard, Catálogo, Membros e Circulação.
              </div>
            </div>
          </Card>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("app")).render(<App />);
  </script>
</body>
</html>
