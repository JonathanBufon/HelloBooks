services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hellobooks}
      POSTGRES_USER: ${POSTGRES_USER:-hellobooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hellobooks}
    ports:
      - "5447:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hellobooks} -d ${POSTGRES_DB:-hellobooks}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6394:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    working_dir: /app
    volumes:
      - ../backend:/app
    env_file:
      - .env.example
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8015
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-hellobooks}
      DB_USERNAME: ${POSTGRES_USER:-hellobooks}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hellobooks}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me}
    ports:
      - "8015:8015"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -lc "composer install && php artisan serve --host=0.0.0.0 --port=8015"

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ../frontend:/app
    ports:
      - "5188:5188"
    depends_on:
      - backend
    command: sh -lc "npm install && npm run dev"

volumes:
  postgres-data:
  redis-data:
