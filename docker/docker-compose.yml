services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hellobooks}
      POSTGRES_USER: ${POSTGRES_USER:-hellobooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hellobooks}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hellobooks} -d ${POSTGRES_DB:-hellobooks}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ..
      dockerfile_inline: |
        FROM php:8.3-cli
        RUN apt-get update \
            && apt-get install -y --no-install-recommends git unzip libpq-dev \
            && docker-php-ext-install pdo_pgsql \
            && pecl install redis \
            && docker-php-ext-enable redis \
            && rm -rf /var/lib/apt/lists/*
        COPY --from=composer:2 /usr/bin/composer /usr/bin/composer
        WORKDIR /app
    working_dir: /app
    volumes:
      - ../backend:/app
    env_file:
      - .env.example
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-hellobooks}
      DB_USERNAME: ${POSTGRES_USER:-hellobooks}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hellobooks}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -lc "composer install && php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ../frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres-data:
  redis-data:
