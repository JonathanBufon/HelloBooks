name: Backend

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hellobooks_test
          POSTGRES_USER: hellobooks
          POSTGRES_PASSWORD: hellobooks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hellobooks -d hellobooks_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: hellobooks_test
      DB_USERNAME: hellobooks
      DB_PASSWORD: hellobooks
      JWT_SECRET: hellobooks-ci-jwt-secret-32-bytes-minimum
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend

      - run: php artisan test
