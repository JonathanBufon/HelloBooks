openapi: 3.1.0
info:
  title: HelloBooks — Gestão de Catálogo
  version: 1.0.0
  description: |
    API REST para gestão de catálogo do sistema HelloBooks (biblioteca).
    Operada exclusivamente pelo cargo `bibliotecario`. Autenticação via JWT
    (Bearer) — emissão e revogação na feature de autenticação.
  contact:
    name: HelloBooks team
servers:
  - url: http://localhost:8000/api/v1
    description: Dev local (Docker Compose)

security:
  - bearerAuth: []

tags:
  - name: Livros
  - name: Exemplares
  - name: Autores
  - name: Editoras
  - name: Categorias

paths:
  /livros:
    get:
      tags: [Livros]
      summary: Lista paginada de livros
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: q
          schema: { type: string }
          description: Termo de busca em título, ISBN, autor ou categoria (case- e acento-insensitive)
      responses:
        '200':
          description: Página de livros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivroPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Livros]
      summary: Cria um livro novo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LivroCreate' }
      responses:
        '201':
          description: Livro criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Livro' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: ISBN já existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /livros/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Livros]
      summary: Detalhe de um livro (com exemplares)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivroDetalhe' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Livros]
      summary: Atualiza um livro
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LivroUpdate' }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Livro' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Conflito de ISBN (já em uso por outro livro)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Livros]
      summary: Remove um livro (sem exemplares e sem histórico)
      responses:
        '204': { description: Removido }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Livro ainda tem exemplares ou histórico de empréstimo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /livros/{id}/exemplares:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Exemplares]
      summary: Lista exemplares de um livro
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Exemplar' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Exemplares]
      summary: Registra um ou mais exemplares novos para o livro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantidade]
              properties:
                quantidade:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: Quantos exemplares físicos registrar (todos nascem 'disponivel'/'intacto')
      responses:
        '201':
          description: Exemplares criados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Exemplar' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /exemplares/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Exemplares]
      summary: Detalhe de um exemplar
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exemplar' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Exemplares]
      summary: Atualiza status e/ou condição de um exemplar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExemplarUpdate' }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exemplar' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Transição de status inválida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Exemplares]
      summary: Remove um exemplar (apenas se 'disponivel' ou 'manutencao')
      responses:
        '204': { description: Removido }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Exemplar em uso (emprestado/reservado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /autores:
    get:
      tags: [Autores]
      summary: Lista paginada de autores
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: Página de autores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutorPage' }
    post:
      tags: [Autores]
      summary: Cria um autor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutorCreate' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Autor' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /autores/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Autores]
      summary: Detalhe de um autor
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Autor' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Autores]
      summary: Atualiza nome do autor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutorCreate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Autor' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Autores]
      summary: Remove um autor (sem livros associados)
      responses:
        '204': { description: Removido }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Autor ainda associado a livros
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /editoras:
    get:
      tags: [Editoras]
      summary: Lista paginada de editoras
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditoraPage' }
    post:
      tags: [Editoras]
      summary: Cria uma editora
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditoraCreate' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Editora' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /editoras/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Editoras]
      summary: Detalhe de uma editora
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Editora' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Editoras]
      summary: Atualiza nome da editora
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditoraCreate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Editora' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Editoras]
      summary: Remove uma editora (sem livros associados)
      responses:
        '204': { description: Removida }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Editora ainda associada a livros
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /categorias:
    get:
      tags: [Categorias]
      summary: Lista paginada de categorias
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoriaPage' }
    post:
      tags: [Categorias]
      summary: Cria uma categoria
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaCreate' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Nome de categoria já existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /categorias/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Categorias]
      summary: Detalhe de uma categoria
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Categorias]
      summary: Atualiza nome da categoria
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaCreate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Nome de categoria já existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Categorias]
      summary: Remove uma categoria (sem livros associados)
      responses:
        '204': { description: Removida }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Categoria ainda associada a livros
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      in: query
      name: per_page
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Cargo insuficiente (apenas bibliotecario)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Erro de validação
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: ISBN_DUPLICADO }
            message: { type: string }
            details:
              type: object
              additionalProperties: true

    Pagination:
      type: object
      required: [total, per_page, current_page, last_page]
      properties:
        total: { type: integer }
        per_page: { type: integer }
        current_page: { type: integer }
        last_page: { type: integer }

    LivroCreate:
      type: object
      required: [titulo, isbn, ano_publicacao, id_editora, autores, categorias]
      properties:
        titulo: { type: string, minLength: 1, maxLength: 255 }
        isbn: { type: string, minLength: 10, maxLength: 13 }
        ano_publicacao: { type: integer, minimum: 1000, maximum: 9999 }
        id_editora: { type: integer, format: int64 }
        autores:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: object
                required: [id_autor]
                properties: { id_autor: { type: integer, format: int64 } }
              - type: object
                required: [nome]
                properties: { nome: { type: string, maxLength: 255 } }
        categorias:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: object
                required: [id_categoria]
                properties: { id_categoria: { type: integer, format: int64 } }
              - type: object
                required: [nome]
                properties: { nome: { type: string, maxLength: 255 } }

    LivroUpdate:
      type: object
      properties:
        titulo: { type: string, maxLength: 255 }
        isbn: { type: string, minLength: 10, maxLength: 13 }
        ano_publicacao: { type: integer, minimum: 1000, maximum: 9999 }
        id_editora: { type: integer, format: int64 }
        autores:
          type: array
          items:
            type: object
            required: [id_autor]
            properties: { id_autor: { type: integer, format: int64 } }
        categorias:
          type: array
          items:
            type: object
            required: [id_categoria]
            properties: { id_categoria: { type: integer, format: int64 } }

    Livro:
      type: object
      required: [id_livro, titulo, isbn, ano_publicacao, id_editora]
      properties:
        id_livro: { type: integer, format: int64 }
        titulo: { type: string }
        isbn: { type: string }
        ano_publicacao: { type: integer }
        id_editora: { type: integer, format: int64 }
        editora: { $ref: '#/components/schemas/Editora' }
        autores:
          type: array
          items: { $ref: '#/components/schemas/Autor' }
        categorias:
          type: array
          items: { $ref: '#/components/schemas/Categoria' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LivroDetalhe:
      allOf:
        - $ref: '#/components/schemas/Livro'
        - type: object
          properties:
            exemplares:
              type: array
              items: { $ref: '#/components/schemas/Exemplar' }
            contagem_exemplares:
              type: object
              properties:
                disponivel: { type: integer }
                emprestado: { type: integer }
                reservado: { type: integer }
                manutencao: { type: integer }

    LivroPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Livro' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    Exemplar:
      type: object
      required: [id_exemplar, id_livro, status, condicao_fisica]
      properties:
        id_exemplar: { type: integer, format: int64 }
        id_livro: { type: integer, format: int64 }
        status:
          type: string
          enum: [disponivel, emprestado, reservado, manutencao]
        condicao_fisica:
          type: string
          enum: [intacto, rabiscado, rasgado, dobrado]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ExemplarUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [disponivel, manutencao]
          description: |
            Transições permitidas pela API de catálogo:
            disponivel ↔ manutencao. Demais transições são bloqueadas
            (são acionadas por empréstimo, reserva, devolução).
        condicao_fisica:
          type: string
          enum: [intacto, rabiscado, rasgado, dobrado]

    Autor:
      type: object
      required: [id_autor, nome]
      properties:
        id_autor: { type: integer, format: int64 }
        nome: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AutorCreate:
      type: object
      required: [nome]
      properties:
        nome: { type: string, minLength: 1, maxLength: 255 }

    AutorPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Autor' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    Editora:
      type: object
      required: [id_editora, nome]
      properties:
        id_editora: { type: integer, format: int64 }
        nome: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EditoraCreate:
      type: object
      required: [nome]
      properties:
        nome: { type: string, minLength: 1, maxLength: 255 }

    EditoraPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Editora' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    Categoria:
      type: object
      required: [id_categoria, nome]
      properties:
        id_categoria: { type: integer, format: int64 }
        nome: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CategoriaCreate:
      type: object
      required: [nome]
      properties:
        nome: { type: string, minLength: 1, maxLength: 255 }

    CategoriaPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Categoria' }
        pagination: { $ref: '#/components/schemas/Pagination' }
